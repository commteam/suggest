[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA 라우팅: /admin 등 모든 경로를 index.html 로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # iframe 삽입은 Microsoft Teams(및 Microsoft 365) 도메인에서만 허용 — X-Frame-Options 대신 CSP frame-ancestors 사용
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://res.cdn.office.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com https://*.skype.com https://teams.live.com https://*.teams.live.com https://teams.cloud.microsoft https://*.cloud.microsoft https://*.office.com https://*.office365.com https://*.microsoft365.com https://*.microsoft.com https://*.sharepoint.com https://outlook.office.com https://outlook.office365.com"
    Referrer-Policy = "strict-origin-when-cross-origin"
